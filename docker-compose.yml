services:
  web:
    image: busybox:1.36
    command: ["httpd", "-f", "-p", "8080", "-h", "/tmp"]
    environment:
      TOKEN: ${WONTON_SECRET_TOKEN}
      EXTRA: ${WONTON_SECRET_EXTRA}
x-wonton:
  spec: "0.8"
  id: app.secretprobe
  version: 1.0.0
  kind: app
  title: {zh: 密钥探针, en: Secret Probe}
  description: {zh: 填密钥的测试插件, en: Fixture for filling in keys}
  permissions: []
  secrets:
    token:
      input:
        title: {zh: 令牌, en: Token}
        description: {zh: 必填的一项, en: Required one}
        url: https://example.com/keys
        required: true
    extra:
      input:
        title: {zh: 附加, en: Extra}
        description: {zh: 可以留空, en: May stay empty}
        url: https://example.com/extra
        required: false
